  sheet_top: '#232b36'
  sheet_bottom: '#14191f'
  text_1: '#eef5f9'
  text_2: '#dee5e9'
  text_3: '#c3cace'
  text_4: '#9fa6aa'
  text_5: '#82888d'
  text_6: '#747a80'
  label: '#90969b'
  icon: '#c9c9c9'
  icon_dim: '#c9c9c9'
  surface: '#f4f9fb'
  line: '#f4f9fb'
  accent: '#6fc3c9'
  accent_deep: '#62acb1'
  accent_bright: '#8fd0d5'
  accent_icon: '#8fd0d5'
